<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelp review</title>
<style>
:root {
  --bg: #f7f8f6; --panel: #ffffff; --ink: #1c2422; --muted: #66736f; --line: #dde3df;
  --accent: #0f766e; --accent-soft: #d5efe9; --open: #b45309; --open-soft: #fdf0d9;
  --no: #b42318; --no-soft: #fde5e2; --focus: #2563eb; --focus-soft: #dfe9ff;
  --chg: #b0461a; --chg-soft: #fbe6dc;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121716; --panel: #1a2120; --ink: #e6ecea; --muted: #94a3a0; --line: #2c3634;
    --accent: #4fd1c0; --accent-soft: #17403b; --open: #f2b45c; --open-soft: #3d2f14;
    --no: #f38b80; --no-soft: #47211d; --focus: #8ab0ff; --focus-soft: #1f2e52;
    --chg: #f39a6b; --chg-soft: #3d2418;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-columns: 250px minmax(0, 1fr) 360px; grid-template-rows: minmax(0, 1fr) auto; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 4px; background: var(--panel); color: var(--muted); }

#items { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
#items h1 { font-size: 15px; margin: 0; padding: 12px 12px 2px; letter-spacing: .02em; }
#items .sub { padding: 0 12px 10px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
.item { padding: 7px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid;
  grid-template-columns: 1fr auto; gap: 2px 8px; }
.item:hover { background: var(--bg); }
.item.current { background: var(--accent-soft); }
.item .text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .meta { color: var(--muted); font-size: 12px; grid-column: 1 / 3; }
.badge { font: 11px var(--mono); border-radius: 9px; padding: 1px 7px; align-self: center; }
.badge.open { background: var(--open-soft); color: var(--open); }
.badge.accepted { background: var(--accent-soft); color: var(--accent); }
.badge.rejected { background: var(--no-soft); color: var(--no); }
.badge.untouched { color: var(--muted); border: 1px solid var(--line); }

#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#top { padding: 14px 20px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
#sentence { font-size: 24px; line-height: 1.5; }
.word { padding: 1px 3px; border-radius: 4px; cursor: pointer; border-bottom: 3px solid transparent; }
.word.open { border-bottom-color: var(--open); }
.word.infocus { background: var(--focus-soft); }
#status { margin-top: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); }
#remaining { font-weight: 600; color: var(--ink); }
#decisions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font: 12px var(--mono); border-radius: 5px; padding: 2px 7px; background: var(--accent-soft); }
.chip.no { background: var(--no-soft); }
.chip b { font-weight: 600; }
#treewrap { flex: 1; overflow: auto; padding: 16px 20px; }
#treenote { color: var(--muted); margin-bottom: 8px; }
svg text { font: 12px var(--mono); fill: var(--ink); }
svg text.entry { fill: var(--muted); font-style: italic; }
svg .word-label { font: 14px system-ui, sans-serif; }
svg .edge { stroke: var(--muted); stroke-width: 1; fill: none; }
svg .drop { stroke: var(--line); stroke-dasharray: 2 3; }
svg .box { fill: var(--panel); stroke: var(--line); rx: 5; cursor: pointer; }
svg .node.open .box { fill: var(--open-soft); stroke: var(--open); stroke-dasharray: 4 3; }
svg .node.focus .box { stroke: var(--focus); stroke-width: 2.5; stroke-dasharray: none; }
svg .node { cursor: pointer; }

#choices { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; min-height: 0; }
#choices h2 { font-size: 13px; margin: 0; padding: 12px 14px 4px; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .05em; }
#focusline { padding: 0 14px 10px; border-bottom: 1px solid var(--line); min-height: 34px; }
#focusline .span { font-size: 16px; }
.choice { padding: 7px 14px; border-bottom: 1px solid var(--line); display: grid;
  grid-template-columns: 22px 1fr auto; gap: 2px 6px; align-items: start; cursor: pointer; }
.choice.sel { background: var(--focus-soft); }
.choice .num { color: var(--muted); font: 12px var(--mono); padding-top: 2px; }
.choice .what { color: var(--muted); font-size: 12px; }
.choice .label { font: 12.5px var(--mono); word-break: break-word; }
.choice .where { font-size: 12px; color: var(--muted); }
.choice .keep { font: 12px var(--mono); color: var(--muted); grid-column: 2; }
.choice .btns { display: flex; gap: 4px; grid-row: 1 / 3; grid-column: 3; align-self: center; }
.choice .btns button { padding: 1px 7px; font-size: 12px; }
.bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 3px; grid-column: 2 / 4; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.empty { padding: 14px; color: var(--muted); }
.doc { font-size: 12.5px; color: var(--ink); grid-column: 2 / 4; }
.doc .ex { color: var(--muted); font-style: italic; }
.doc .lt { font: 11.5px var(--mono); color: var(--muted); }
.chainrow { margin-top: 6px; } .chainrow .label { font: 12.5px var(--mono); }
h3.sec { font-size: 13px; margin: 18px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
svg .arc { stroke: var(--accent); stroke-width: 1.3; fill: none; }
svg .arc.q { stroke: var(--line); }
svg .arclabel { font: 10.5px var(--mono); fill: var(--muted); }
svg .pred { font: 12.5px var(--mono); } svg .pred.top { font-weight: 700; fill: var(--accent); }
svg .carg { font: 11px var(--mono); fill: var(--muted); }
#gallery { display: flex; flex-wrap: wrap; gap: 10px; max-height: 44vh; overflow: auto; padding: 2px; margin-bottom: 6px; }
#gallery.all, #gallery.fit { max-height: none; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px 6px; cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card.current { border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus-soft); }
.card.out { opacity: .28; }
.card.unchecked { border-style: dashed; }
#guide { background: var(--focus-soft); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
.choicehead { padding: 8px 14px 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
.card .no { font: 11px var(--mono); color: var(--muted); }
.card .sum, #meaningsum { font: 12px var(--mono); line-height: 1.45; }
.card .sum div:first-child, #meaningsum div:first-child { font-weight: 700; color: var(--accent); }
#meaningsum { margin-bottom: 8px; font-size: 13px; }
svg .mini-edge { stroke: var(--muted); stroke-width: 1; }
svg .mini-dot { fill: var(--muted); } svg .mini-dot.open { fill: var(--open); }
svg .mini-label { font: 9.5px var(--mono); fill: var(--open); }
svg .mini-word { font: 10px system-ui, sans-serif; fill: var(--ink); }
#treebar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; color: var(--muted); flex-wrap: wrap; }
#treebar button { padding: 1px 8px; }

body.wide { grid-template-columns: 250px minmax(0, 1fr) 0; }
body.wide #choices { display: none; }
#readbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
#readbar .sec { margin: 0 8px 0 0; }
#readbar button.on { background: var(--accent-soft); border-color: var(--accent); }
.reading { flex: 1 1 380px; min-width: 0; max-width: 100%; }
.reading .rhead { display: flex; gap: 8px; align-items: center; margin: 2px 0 4px; }
.reading .rhead .n { font: 600 13px var(--mono); background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 1px 8px; }
.reading .rhead .cnt { color: var(--muted); font-size: 12px; flex: 1; }
.reading .gscroll { overflow-x: auto; }
.reading .wordsdiff { font-size: 12.5px; margin-top: 4px; }
.reading .wordsdiff .w { font-weight: 600; }
.reading .wordsdiff .t { font: 12px var(--mono); }
.reading .expl { margin-top: 6px; padding: 6px 8px; border-left: 3px solid var(--accent); background: var(--bg); font-size: 13px; }
.reading .expl small { color: var(--muted); display: block; }
.orange { color: var(--chg); font-weight: 600; }
svg .arc.diff { stroke: var(--chg); stroke-width: 2.2; }
svg .arc.same { stroke: var(--muted); stroke-width: 1; }
svg .arclabel.diff { fill: var(--chg); font-weight: 700; }
svg .gnode { fill: none; stroke: none; }
svg .gnode.diff { fill: var(--chg-soft); stroke: var(--chg); stroke-width: 1.5; }
svg .pred.lk2 { cursor: pointer; }
svg .gentry { font: italic 11px var(--mono); fill: var(--muted); cursor: pointer; }
.more { padding: 10px 14px; }
#keys { grid-column: 1 / 4; border-top: 1px solid var(--line); background: var(--panel); padding: 6px 12px;
  color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
#help { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: none; align-items: center; justify-content: center; }
#help.on { display: flex; }
#help div { background: var(--panel); border-radius: 10px; padding: 20px 26px; max-width: 560px; }
#help table { border-collapse: collapse; } #help td { padding: 3px 12px 3px 0; vertical-align: top; }
#lookup { position: fixed; top: 0; right: 0; bottom: 0; width: min(860px, 94vw); background: var(--panel);
  border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0, 0, 0, .18); display: none; flex-direction: column; z-index: 5; }
#lookup.on { display: flex; }
#lookup header { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
#lookup input { flex: 1; font: 14px var(--mono); padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); }
#lookupbody { overflow: auto; padding: 12px 14px; flex: 1; }
#lookupbody pre { font: 12.5px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px; overflow-x: auto; white-space: pre; margin: 4px 0 16px; }
#lookupbody .src { color: var(--muted); font-size: 12px; }
table.cmp { border-collapse: collapse; margin: 8px 0 18px; font-size: 13px; }
table.cmp th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 4px 10px 4px 6px; border-bottom: 1px solid var(--line); }
table.cmp td { padding: 5px 10px 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.cmp td:nth-child(-n+3) { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
table.cmp td.ex { color: var(--muted); font-style: italic; }
table.cmp tr.asked { background: var(--focus-soft); }
.lk { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
#error { position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%); background: var(--no-soft);
  color: var(--no); padding: 8px 14px; border-radius: 6px; display: none; }

body { grid-template-columns: 300px minmax(0, 1fr); }
#keys { grid-column: 1 / 3; }
.item .grp { color: var(--muted); font-size: 12px; grid-column: 1 / 3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#group { color: var(--muted); margin-top: 6px; }
#group b { color: var(--ink); }
#sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 1100px) { #sides { grid-template-columns: minmax(0, 1fr); } }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.side.won { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.side h4 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.tick { font-size: 15px; padding: 2px 12px; border-radius: 16px; }
.tick.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
#diffbox { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 15px; }
#diffbox small { color: var(--muted); display: block; font-size: 12px; }
svg .fold { cursor: pointer; fill: var(--muted); font: 12px system-ui, sans-serif; }
svg .node.folded .box { stroke-dasharray: 2 3; }
svg .foldwords { font: 13px system-ui, sans-serif; fill: var(--muted); }
.side h4 .n { font: 600 13px var(--mono); background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 1px 8px; }
.side h4 .lab { color: var(--muted); font-weight: 400; }
.side .scroll { overflow-x: auto; }
.side .part { color: var(--muted); font-size: 12px; margin: 8px 0 2px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.wordsdiff { font-size: 12.5px; margin-top: 4px; } .wordsdiff .w { font-weight: 600; } .wordsdiff .t { font: 12px var(--mono); }
.expl { margin-top: 6px; padding: 6px 8px; border-left: 3px solid var(--accent); background: var(--bg); font-size: 13px; }
.expl small { color: var(--muted); display: block; }
svg .node.diff .box { fill: var(--chg-soft); stroke: var(--chg); stroke-width: 1.5; }
#verdict { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0 8px; }
#verdict button.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
#note { width: 100%; min-height: 2.6em; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); resize: vertical; }
</style>
</head>
<body>
<nav id="items"><h1>Kelp review</h1><div class="sub" id="profile"></div><div id="itemlist"></div></nav>
<section id="main">
  <div id="top">
    <div id="sentence"></div>
    <div id="group"></div>
  </div>
  <div id="treewrap">
    <div id="guide"></div>
    <div id="diffbox"></div>
    <div id="readbar"><span id="readbtns"></span></div>
    <div id="sides"></div>
    <div id="verdict"></div>
    <textarea id="note" placeholder="Note (optional; saved when you leave the box)"></textarea>
  </div>
</section>
<footer id="keys">
  <span><kbd>1</kbd> <kbd>2</kbd> check or uncheck the left, right analysis (both can be checked)</span><span><kbd>x</kbd> neither is right</span>
  <span><kbd>0</kbd> clear</span><span><kbd>t</kbd> unfold or fold the parts both trees share</span><span><kbd>Enter</kbd> next without a verdict</span><span><kbd>n</kbd><kbd>p</kbd> next, previous</span>
  <span><kbd>w</kbd> whole graphs</span><span><kbd>e</kbd> explain the difference</span><span><kbd>l</kbd> look up in the grammar</span>
</footer>
<aside id="lookup">
  <header><input id="lookupq" placeholder="rule, type, lexical entry or predicate" spellcheck="false">
    <button id="lookupback">Back</button><button id="lookupclose">Close <kbd>Esc</kbd></button></header>
  <div id="lookupbody"></div>
</aside>
<div id="error"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
let items = [], cur = 0, docs = {}, whole = false, explainer = null, labeled = false, asking = false, busy = false;
let fold = {}, unfolded = false;      // per item and side: nodes folded or unfolded by hand; everything unfolded
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) { if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
  for (const kid of kids) e.append(kid);
  return e;
}
function svg(tag, attrs, text) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
function showError(msg) {
  const e = $('error'); e.textContent = msg; e.style.display = 'block';
  setTimeout(() => { e.style.display = 'none'; }, 4000);
}
/* ---- grammar lookup ---- */
const trail = [];
function link(name, text) {
  const a = el('span', {class: 'lk', title: 'look up in the grammar'}, text || name);
  a.onclick = ev => { ev.stopPropagation(); lookUp(name); };
  return a;
}
function plain(doc) {     // the ERG's shorthand in its type descriptions, spelled out where it is unambiguous
  return doc.replace(/^Cmps\b/, 'Complements:').replace(/\(opt\)/g, ' (optional)').replace(/,(?=\S)/g, ', ');
}
async function lookUp(name, back) {
  if (!name) return;
  $('lookup').classList.add('on');
  $('lookupq').value = name;
  const body = $('lookupbody'); body.replaceChildren();
  let r;
  try { r = await (await fetch('/api/lookup?name=' + encodeURIComponent(name))).json(); } catch (e) { r = {error: 'no answer'}; }
  if (!back) trail.push(name);
  if (r.error) { body.append(el('div', {class: 'empty'}, r.error)); return; }
  if (r.same_spelling.length) {
    const asked = r.same_spelling.filter(e => e.asked).map(e => e.name);
    const intro = el('div', {});
    if (r.predicate) intro.append('The predicate ', el('b', {}, r.predicate), ' comes from the highlighted ' +
        (asked.length > 1 ? 'entries' : 'entry') + '. ');
    intro.append('All lexical entries of the grammar with the same spelling, for comparison. ' +
      'The grammar numbers entry names and predicate names separately, so the numbers need not match.');
    body.append(intro);
    const table = el('table', {class: 'cmp'}, el('tr', {}, ...['Lexical entry', 'Predicate', 'Lexical type', 'What the type says', 'The type\u2019s example (any word)'].map(h => el('th', {}, h))));
    for (const e of r.same_spelling)
      table.append(el('tr', {class: e.asked ? 'asked' : ''}, el('td', {}, link(e.name)),
        el('td', {}, e.predicate ? link(e.predicate) : ''), el('td', {}, e.type ? link(e.type) : ''),
        el('td', {}, plain(e.doc)), el('td', {class: 'ex'}, e.ex.length ? e.ex[0] : '')));
    body.append(table);
  }
  for (const d of r.definitions) {
    body.append(el('div', {class: 'src'}, d.file + ', line ' + d.line));
    const pre = el('pre', {}), known = new Set(d.names);
    for (const part of d.text.split(/([A-Za-z_*][\w\-+*.\/]*)/)) pre.append(known.has(part.toLowerCase()) ? link(part.toLowerCase(), part) : part);
    body.append(pre);
  }
  if (!r.predicate && !r.definitions.length) body.append(el('div', {class: 'empty'}, 'The grammar has nothing under this name.'));
}
$('lookupclose').onclick = () => $('lookup').classList.remove('on');
$('lookupback').onclick = () => { if (trail.length > 1) { trail.pop(); lookUp(trail[trail.length - 1], true); } };
$('lookupq').addEventListener('keydown', ev => {
  if (ev.key === 'Enter') lookUp($('lookupq').value.trim());
  if (ev.key === 'Escape') $('lookup').classList.remove('on');
  ev.stopPropagation();
});

/* ---- meaning graphs ---- */
function prepare(it) {            // facts of both sides; with character positions when both have them everywhere
  const gs = [it.left.dmrs, it.right.dmrs].filter(Boolean);
  const pos = gs.every(g => g.nodes.every(n => n.from >= 0 && n.to >= 0));
  for (const g of gs) {
    const name = {}, f = g.facts = {}, add = x => { f[x] = (f[x] || 0) + 1; return x; };
    for (const n of g.nodes) {
      name[n.id] = n.pred + (n.carg ? '("' + n.carg + '")' : '') + (pos ? '<' + n.from + ':' + n.to + '>' : '');
      n.fact = add('node ' + name[n.id]);
    }
    for (const k of g.links) k.fact = add(name[k.from] + ' -' + (k.role || '') + (k.post && k.post !== 'NEQ' ? '/' + k.post : '') + '-> ' + name[k.to]);
    const i = new Map(g.nodes.map((n, k) => [n, k]));
    g.order = pos ? [...g.nodes].sort((a, b) => a.from - b.from || b.to - a.to || i.get(a) - i.get(b)) : g.nodes;
  }
  const out = new Set();
  if (gs.length === 2) for (const g of gs) for (const x in g.facts) if (gs.some(o => (o.facts[x] || 0) !== g.facts[x])) out.add(x);
  return out;
}
function drawGraph(g, varying, full) {
  let keep = null;
  if (!full) {
    keep = new Set();
    for (const n of g.nodes) if (varying.has(n.fact)) keep.add(n.id);
    for (const k of g.links) if (varying.has(k.fact)) { keep.add(k.from); keep.add(k.to); }
  }
  const pos = {}; let x = 10;
  g.order.filter(n => !keep || keep.has(n.id)).forEach((n, i) => {
    const text = n.pred + (n.carg ? '(' + n.carg + ')' : ''), w = text.length * 7.6 + 14;
    pos[n.id] = {n, i, x: x + w / 2, w, text, diff: varying.has(n.fact)}; x += w + 14;
  });
  const links = g.links.filter(k => pos[k.from] && pos[k.to] && (full || varying.has(k.fact) || k.role !== 'RSTR'));
  const H = k => 18 + 13 * Math.min(Math.abs(pos[k.from].i - pos[k.to].i), 9);
  const base = Math.max(30, ...links.map(H)) + 16;
  const s = svg('svg', {width: x, height: base + 30});

/* ---- trees ---- */
function flat(n, out) { out.push(n); for (const c of n.children) flat(c, out); return out; }

function wordNotes(side, other) {   // the words that the two sides analyze with different lexical entries

/* ---- page ---- */
const NAME = {left: 'Left', right: 'Right', both: 'Both', neither: 'Neither'};
function badge(it) {

}
function renderList() {

      el('span', {class: 'grp'}, (it.group_label || it.group || it.id) + (it.group_size ? ' · ' + it.group_size + (it.group_size === 1 ? ' item' : ' items') : '')));

}
function render() {

  button(whole ? 'Only the differences' : 'Whole graphs', 'w', () => { whole = !whole; render(); }, whole);
  button(unfolded ? 'Fold what both trees share' : 'Unfold the trees', 't', toggleTrees, unfolded);

        el('span', {class: 'lab'}, s.root ? '(' + s.root + ')' : '')));
    if (s.error) box.append(el('div', {class: 'empty'}, 'This analysis could not be read: ' + s.error));

      box.append(el('div', {class: 'part'}, 'Meaning'));
      if (same) box.append(el('div', {class: 'where'}, 'The two meanings are the same' + (whole ? '.' : ' (w draws them).')));
      if (!same || whole) box.append(el('div', {class: 'scroll'}, drawGraph(s.dmrs, varying, whole || !mine)));
      if (!same && !mine && !whole && o.dmrs) box.append(el('div', {class: 'where'}, 'This side has nothing that the other lacks: it lacks what is orange there.'));

function check(w) {                 // toggle one side's check mark; both checked means both are right

$('note').addEventListener('change', () => judge(undefined, $('note').value));
